name: Diag xcodebuild
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: version
        run: xcodebuild -version
      - name: list project
        run: xcodebuild -project HanimeApp.xcodeproj -list
      - name: build minimal
        run: xcodebuild -project HanimeApp.xcodeproj -scheme HanimeApp -sdk iphonesimulator -configuration Debug build CODE_SIGNING_ALLOWED=NO 2>&1 | tail -30
