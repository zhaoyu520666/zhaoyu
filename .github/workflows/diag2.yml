name: Diag2 pbxproj
on:
  workflow_dispatch:
jobs:
  diag2:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: lint pbxproj
        run: plutil -lint HanimeApp.xcodeproj/project.pbxproj
      - name: env sanity (fresh swift package)
        run: |
          cd /tmp && rm -rf envtest && mkdir envtest && cd envtest
          swift package init --type tool >/dev/null 2>&1
          xcodebuild -list 2>&1 | head -10 || true
      - name: crash report
        run: |
          sleep 2
          CRASH=$(ls -t ~/Library/Logs/DiagnosticReports/xcodebuild-*.ips 2>/dev/null | head -1)
          echo "crash file: $CRASH"
          if [ -n "$CRASH" ]; then head -c 4000 "$CRASH"; fi
